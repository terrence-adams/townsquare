name: townsquare

# Release input only.  `deploy/release.env` supplies immutable image digests;
# Dockerfiles remain in-tree solely for the reproducible/offline build workflow.
# No service publishes a LAN address.  Remote operators use an authenticated
# SSH tunnel to one of the loopback bindings.
x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  mem_limit: 512m
  cpus: 1.0
  restart: unless-stopped
  logging:
    driver: local
    options: {max-size: 10m, max-file: "5"}

x-registry-r7-build-args: &registry-r7-build-args
  PYTHON_IMAGE: "${TOWNSQUARE_PYTHON_IMAGE:?set immutable Python base reference}"
  TOWNSQUARE_RUNTIME_CLASS: CANARY
  TOWNSQUARE_AUTHORITY_CLASS: NON-AUTHORITATIVE
  TOWNSQUARE_CANARY_LABEL: TS-CANARY-NAS1-20261007-A
  TOWNSQUARE_COMPOSE_PROJECT: townsquare-canary-20261007-a
  TOWNSQUARE_SOURCE_COMMIT: "${TOWNSQUARE_SOURCE_COMMIT:?set exact Registry successor commit}"
  TOWNSQUARE_SOURCE_TREE: "${TOWNSQUARE_SOURCE_TREE:?set exact Registry successor tree}"
  TOWNSQUARE_R7_RELEASE_ID: "${TOWNSQUARE_R7_RELEASE_ID:?set exact R7 release id}"
  TOWNSQUARE_R7_INPUT_MANIFEST_SHA256: "${TOWNSQUARE_R7_INPUT_MANIFEST_SHA256:?set exact R7 input manifest digest}"
  TOWNSQUARE_R7_IDENTITY_SHA256: "${TOWNSQUARE_R7_IDENTITY_SHA256:?set exact R7 identity digest}"

x-registry-r7-environment: &registry-r7-environment
  TOWNSQUARE_RUNTIME_CLASS: CANARY
  TOWNSQUARE_AUTHORITY_CLASS: NON-AUTHORITATIVE
  TOWNSQUARE_CANARY_LABEL: TS-CANARY-NAS1-20261007-A
  TOWNSQUARE_COMPOSE_PROJECT: townsquare-canary-20261007-a
  TOWNSQUARE_SOURCE_COMMIT: "${TOWNSQUARE_SOURCE_COMMIT:?set exact Registry successor commit}"
  TOWNSQUARE_SOURCE_TREE: "${TOWNSQUARE_SOURCE_TREE:?set exact Registry successor tree}"
  TOWNSQUARE_R7_RELEASE_ID: "${TOWNSQUARE_R7_RELEASE_ID:?set exact R7 release id}"
  TOWNSQUARE_R7_INPUT_MANIFEST_SHA256: "${TOWNSQUARE_R7_INPUT_MANIFEST_SHA256:?set exact R7 input manifest digest}"
  TOWNSQUARE_R7_IDENTITY_SHA256: "${TOWNSQUARE_R7_IDENTITY_SHA256:?set exact R7 identity digest}"
  TOWNSQUARE_R7_IDENTITY_FILE: /opt/townsquare/release/r7-identity.json
  TOWNSQUARE_CONTEXT_MANIFEST: /run/config/canary-context-manifest.json

services:
  ledger-migrate:
    image: "${TOWNSQUARE_LEDGER_IMAGE:?set immutable ledger image reference}"
    build:
      context: .
      dockerfile: registrar/Dockerfile
      args: *registry-r7-build-args
    <<: *hardened
    restart: "no"
    user: "10001:10001"
    command: ["python", "-m", "canary.preexec", "--", "python", "-c", "from registrar.app.db import connect,migrate; import os; d=connect(os.environ['REGISTRAR_DB']); migrate(d); d.close()"]
    environment:
      <<: *registry-r7-environment
      REGISTRAR_DB: /var/lib/townsquare/ledger.db
      TOWNSQUARE_RECEIPT_HASH_KEY_FILE: /run/secrets/receipt_hash_key
    volumes:
      - type: bind
        source: "${TOWNSQUARE_LEDGER_DATA_DIR:?set a local durable data directory}"
        target: /var/lib/townsquare
    secrets: [receipt_hash_key]
    configs:
      - {source: context_manifest, target: /run/config/canary-context-manifest.json}
      - {source: r7_identity, target: /opt/townsquare/release/r7-identity.json}
    tmpfs: [/tmp:rw,noexec,nosuid,size=32m,mode=1777]
    networks: [app]

  ledger:
    image: "${TOWNSQUARE_LEDGER_IMAGE:?set immutable ledger image reference}"
    build:
      context: .
      dockerfile: registrar/Dockerfile
      args: *registry-r7-build-args
    <<: *hardened
    user: "10001:10001"
    depends_on:
      ledger-migrate: {condition: service_completed_successfully}
    environment:
      <<: *registry-r7-environment
      REGISTRAR_ENV: mvp
      REGISTRAR_DB: /var/lib/townsquare/ledger.db
      REGISTRAR_TOKEN_PEPPER_FILE: /run/secrets/token_pepper
      REGISTRAR_CURSOR_KEY_FILE: /run/secrets/cursor_signing_key
      TOWNSQUARE_RECEIPT_HASH_KEY_FILE: /run/secrets/receipt_hash_key
      TOWNSQUARE_SERVICE_ID: townsquare-ledger-v0
      TOWNSQUARE_LEDGER_SCHEMA_HEAD: "14"
      TOWNSQUARE_REGISTRY_AUDIT_CONTRACT: registry-ledger-audit-v1
      # Release-pinned Registry integration tuple; Ledger readiness fails closed
      # when this deployed contract does not match its own compiled contract.
      REGISTRY_INTEGRATION_ENABLED: "true"
      REGISTRY_SERVICE_ID: townsquare-registry-v0
      REGISTRY_SCHEMA_HEAD: "2"
      REGISTRY_AUDIT_CONTRACT_VERSION: registry-ledger-audit-v1
      REGISTRY_READINESS_URL: "${REGISTRY_SESSION_PUBLIC_URL:?set exact Session Registry public URL}/health/ready"
      REGISTRY_READINESS_TOKEN_FILE: /run/secrets/ledger_registry_readiness_token
      REGISTRY_PEER_READINESS_TOKEN_FILE: /run/secrets/registry_ledger_readiness_token
      TOWNSQUARE_AUTHORITY_PUBLIC_KEY_FILE: /run/configs/authority_public_key
      TOWNSQUARE_AUTHORITY_PROOF_FILE: /run/configs/authority_proof
      TOWNSQUARE_AUTHORITY_SIGNATURE_FILE: /run/configs/authority_proof_signature
      TOWNSQUARE_MINISIGN_EXECUTABLE: /usr/local/bin/minisign
    volumes:
      - type: bind
        source: "${TOWNSQUARE_LEDGER_DATA_DIR:?set a local durable data directory}"
        target: /var/lib/townsquare
    secrets: [token_pepper, cursor_signing_key, receipt_hash_key, registry_ledger_readiness_token, ledger_registry_readiness_token]
    configs:
      - {source: context_manifest, target: /run/config/canary-context-manifest.json}
      - {source: r7_identity, target: /opt/townsquare/release/r7-identity.json}
      - authority_public_key
      - authority_proof
      - authority_proof_signature
    tmpfs: [/tmp:rw,noexec,nosuid,size=32m,mode=1777]
    ports: ["127.0.0.1:${TOWNSQUARE_LEDGER_PORT:-8790}:8790"]
    networks: [app, ingress]
    healthcheck:
      test: [CMD, python, -m, canary.preexec, --, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8790/health/internal/ready',timeout=2).read()"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s

  viewer:
    image: "${TOWNSQUARE_VIEWER_IMAGE:?set immutable viewer image reference}"
    build:
      context: .
      dockerfile: viewer/Dockerfile
      args: *registry-r7-build-args
    <<: *hardened
    user: "10002:10002"
    depends_on:
      ledger: {condition: service_healthy}
    environment:
      <<: *registry-r7-environment
      REGISTRAR_BASE_URL: http://ledger:8790
      REGISTRAR_API_TOKEN_FILE: /run/secrets/viewer_api_token
      HOME: /tmp
    secrets: [viewer_api_token]
    configs:
      - {source: context_manifest, target: /run/config/canary-context-manifest.json}
      - {source: r7_identity, target: /opt/townsquare/release/r7-identity.json}
    tmpfs: [/tmp:rw,noexec,nosuid,size=64m,mode=1777]
    ports: ["127.0.0.1:${TOWNSQUARE_VIEWER_PORT:-8502}:8502"]
    networks: [app, ingress]
    healthcheck:
      test: [CMD, python, -m, canary.preexec, --, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8502/_stcore/health',timeout=2).read()"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 45s

  registry:
    image: "${TOWNSQUARE_REGISTRY_IMAGE:?set immutable registry image reference}"
    build:
      context: .
      dockerfile: registry/Dockerfile
      args: *registry-r7-build-args
    <<: *hardened
    user: "10003:10003"
    depends_on:
      registry-migrate: {condition: service_completed_successfully}
    environment:
      <<: *registry-r7-environment
      REGISTRY_DB: /var/lib/registry/registry.db
      TOWNSQUARE_RELEASE_START_UUID: "${TOWNSQUARE_RELEASE_START_UUID:?set fresh shared Registry release-start UUID}"
      REGISTRY_AUDIT_INTERVAL_SECONDS: "30"
      REGISTRY_TOKEN_FILE: /run/secrets/registry_api_token
      REGISTRY_AUDIT_CONTRACT_VERSION: registry-ledger-audit-v1
      REGISTRY_SERVICE_ID: townsquare-registry-v0
      REGISTRY_SCHEMA_HEAD: "2"
      REGISTRY_LEDGER_SERVICE_ID: townsquare-ledger-v0
      REGISTRY_LEDGER_SCHEMA_HEAD: "14"
      REGISTRY_LEDGER_AUDIT_CONTRACT: registry-ledger-audit-v1
      REGISTRY_LEDGER_AUDIT_TOKEN_FILE: /run/secrets/ledger_registry_audit_token
      LEDGER_READINESS_URL: http://ledger:8790/health/ready
      LEDGER_READINESS_TOKEN_FILE: /run/secrets/registry_ledger_readiness_token
      REGISTRY_PEER_READINESS_TOKEN_FILE: /run/secrets/ledger_registry_readiness_token
      REGISTRY_LEDGER_AUDIT_CREDENTIAL_REVISION: "${REGISTRY_LEDGER_AUDIT_CREDENTIAL_REVISION:?set exact audit credential revision}"
      LEDGER_READINESS_CREDENTIAL_REVISION: "${LEDGER_READINESS_CREDENTIAL_REVISION:?set exact outbound readiness credential revision}"
      REGISTRY_PEER_READINESS_CREDENTIAL_REVISION: "${REGISTRY_PEER_READINESS_CREDENTIAL_REVISION:?set exact inbound readiness credential revision}"
      REGISTRY_AUDIT_DELIVERY_MODE: manual
      REGISTRY_SESSION_BIND_HOST: "${REGISTRY_SESSION_BIND_HOST:?set exact Session Registry bind host}"
      REGISTRY_SESSION_BIND_PORT: "${REGISTRY_SESSION_BIND_PORT:?set exact Session Registry bind port}"
      REGISTRY_SESSION_PUBLIC_URL: "${REGISTRY_SESSION_PUBLIC_URL:?set exact Session Registry public URL}"
      REGISTRY_SESSION_LISTENER_SHA256: "${REGISTRY_SESSION_LISTENER_SHA256:?set exact Session Registry listener digest}"
    volumes:
      - type: bind
        source: "${TOWNSQUARE_REGISTRY_DATA_DIR:?set a separate durable registry data directory}"
        target: /var/lib/registry
    secrets: [registry_api_token, ledger_registry_audit_token, registry_ledger_readiness_token, ledger_registry_readiness_token]
    configs:
      - {source: context_manifest, target: /run/config/canary-context-manifest.json}
      - {source: r7_identity, target: /opt/townsquare/release/r7-identity.json}
    tmpfs: [/tmp:rw,noexec,nosuid,size=32m,mode=1777]
    networks: [app]
    healthcheck:
      test: [CMD, python, -m, canary.preexec, --, python, -c, "import urllib.request; t=open('/run/secrets/ledger_registry_readiness_token').read().strip(); urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:${REGISTRY_SESSION_BIND_PORT:?set exact Session Registry bind port}/health/ready',headers={'Authorization':'Bearer '+t}),timeout=2).read()"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s

  registry-audit-worker:
    image: "${TOWNSQUARE_REGISTRY_IMAGE:?set immutable registry image reference}"
    <<: *hardened
    user: "10003:10003"
    command: ["python", "-m", "canary.preexec", "--", "python", "-m", "registry.app", "--audit-worker"]
    depends_on:
      registry-migrate: {condition: service_completed_successfully}
    environment:
      <<: *registry-r7-environment
      REGISTRY_DB: /var/lib/registry/registry.db
      TOWNSQUARE_RELEASE_START_UUID: "${TOWNSQUARE_RELEASE_START_UUID:?set fresh shared Registry release-start UUID}"
      REGISTRY_AUDIT_INTERVAL_SECONDS: "30"
      REGISTRY_AUDIT_CONTRACT_VERSION: registry-ledger-audit-v1
      REGISTRY_SERVICE_ID: townsquare-registry-v0
      REGISTRY_SCHEMA_HEAD: "2"
      REGISTRY_LEDGER_SERVICE_ID: townsquare-ledger-v0
      REGISTRY_LEDGER_SCHEMA_HEAD: "14"
      REGISTRY_LEDGER_AUDIT_CONTRACT: registry-ledger-audit-v1
      REGISTRY_LEDGER_AUDIT_TOKEN_FILE: /run/secrets/ledger_registry_audit_token
      LEDGER_READINESS_URL: http://ledger:8790/health/ready
      LEDGER_READINESS_TOKEN_FILE: /run/secrets/registry_ledger_readiness_token
      REGISTRY_PEER_READINESS_TOKEN_FILE: /run/secrets/ledger_registry_readiness_token
      REGISTRY_LEDGER_AUDIT_CREDENTIAL_REVISION: "${REGISTRY_LEDGER_AUDIT_CREDENTIAL_REVISION:?set exact audit credential revision}"
      LEDGER_READINESS_CREDENTIAL_REVISION: "${LEDGER_READINESS_CREDENTIAL_REVISION:?set exact outbound readiness credential revision}"
      REGISTRY_PEER_READINESS_CREDENTIAL_REVISION: "${REGISTRY_PEER_READINESS_CREDENTIAL_REVISION:?set exact inbound readiness credential revision}"
    volumes:
      - type: bind
        source: "${TOWNSQUARE_REGISTRY_DATA_DIR:?set a separate durable registry data directory}"
        target: /var/lib/registry
    secrets: [ledger_registry_audit_token, registry_ledger_readiness_token, ledger_registry_readiness_token]
    configs:
      - {source: context_manifest, target: /run/config/canary-context-manifest.json}
      - {source: r7_identity, target: /opt/townsquare/release/r7-identity.json}
    tmpfs: [/tmp:rw,noexec,nosuid,size=32m,mode=1777]
    networks: [app]

  # Independent database, independent exclusive migrator. This is intentionally
  # not the Ledger `migrate` service and never shares a transaction with it.
  registry-migrate:
    image: "${TOWNSQUARE_REGISTRY_IMAGE:?set immutable registry image reference}"
    build:
      context: .
      dockerfile: registry/Dockerfile
      args: *registry-r7-build-args
    <<: *hardened
    restart: "no"
    user: "10003:10003"
    command: ["python", "-m", "canary.preexec", "--", "python", "/app/migrate.py"]
    environment:
      <<: *registry-r7-environment
      REGISTRY_DB: /var/lib/registry/registry.db
    volumes:
      - type: bind
        source: "${TOWNSQUARE_REGISTRY_DATA_DIR:?set a separate durable registry data directory}"
        target: /var/lib/registry
    configs:
      - {source: context_manifest, target: /run/config/canary-context-manifest.json}
      - {source: r7_identity, target: /opt/townsquare/release/r7-identity.json}
    tmpfs: [/tmp:rw,noexec,nosuid,size=32m,mode=1777]
    networks: [app]

  backup:
    image: "${TOWNSQUARE_BACKUP_IMAGE:?set immutable backup image reference}"
    build:
      context: .
      dockerfile: backup/Dockerfile
      args: *registry-r7-build-args
    <<: *hardened
    profiles: [operations]
    restart: "no"
    user: "10004:10004"
    command: ["python", "/opt/townsquare/backup/create-backup.py"]
    environment:
      <<: *registry-r7-environment
      TOWNSQUARE_LEDGER_DB: /var/lib/townsquare/ledger.db
      TOWNSQUARE_REGISTRY_DB: /var/lib/registry/registry.db
      TOWNSQUARE_BACKUP_DIR: /var/backups/townsquare
      TOWNSQUARE_BACKUP_RECIPIENT_FILE: /run/secrets/backup_recipient
    volumes:
      - type: bind
        source: "${TOWNSQUARE_LEDGER_DATA_DIR:?set a local durable data directory}"
        target: /var/lib/townsquare
        read_only: true
      - type: bind
        source: "${TOWNSQUARE_REGISTRY_DATA_DIR:?set separate registry data directory}"
        target: /var/lib/registry
        read_only: true
      - type: bind
        source: "${TOWNSQUARE_BACKUP_DIR:?set encrypted backup destination}"
        target: /var/backups/townsquare
    secrets: [backup_recipient]
    configs:
      - {source: context_manifest, target: /run/config/canary-context-manifest.json}
      - {source: r7_identity, target: /opt/townsquare/release/r7-identity.json}
    tmpfs: [/tmp:rw,noexec,nosuid,size=128m,mode=1777]
    network_mode: none

networks:
  app: {internal: true}
  ingress: {internal: false}

secrets:
  token_pepper: {file: "${TOWNSQUARE_TOKEN_PEPPER_FILE:?set secret path}"}
  cursor_signing_key: {file: "${TOWNSQUARE_CURSOR_SIGNING_KEY_FILE:?set secret path}"}
  receipt_hash_key: {file: "${TOWNSQUARE_RECEIPT_HASH_KEY_FILE:?set secret path}"}
  viewer_api_token: {file: "${TOWNSQUARE_VIEWER_API_TOKEN_FILE:?set secret path}"}
  registry_api_token: {file: "${TOWNSQUARE_REGISTRY_API_TOKEN_FILE:?set secret path}"}
  ledger_registry_audit_token: {file: "${TOWNSQUARE_REGISTRY_LEDGER_AUDIT_TOKEN_FILE:?set scoped secret path}"}
  registry_ledger_readiness_token: {file: "${TOWNSQUARE_REGISTRY_LEDGER_READINESS_TOKEN_FILE:?set scoped secret path}"}
  ledger_registry_readiness_token: {file: "${TOWNSQUARE_LEDGER_REGISTRY_READINESS_TOKEN_FILE:?set scoped secret path}"}
  backup_recipient: {file: "${TOWNSQUARE_BACKUP_RECIPIENT_FILE:?set secret path}"}
configs:
  context_manifest: {file: "${TOWNSQUARE_CONTEXT_MANIFEST:?set immutable manifest file}"}
  r7_identity: {file: "${TOWNSQUARE_R7_IDENTITY_FILE:?set immutable R7 identity file}"}
  authority_public_key: {file: "${TOWNSQUARE_AUTHORITY_PUBLIC_KEY_FILE:?set public verification key}"}
  authority_proof: {file: "${TOWNSQUARE_AUTHORITY_PROOF_FILE:?set canonical authority proof}"}
  authority_proof_signature: {file: "${TOWNSQUARE_AUTHORITY_SIGNATURE_FILE:?set detached proof signature}"}
