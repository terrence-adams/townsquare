# NAS-only placement overlay. Apply only after deploy/nas-preflight.ps1 has
# produced reviewed evidence. It introduces no host port, host network, socket,
# or DNS assumption; base compose remains cloud-portable.
services:
  ledger:
    volumes:
      - type: bind
        source: ${TOWNSQUARE_LEDGER_DATA_DIR:?must be NAS-local, not SMB/NFS}
        target: /var/lib/townsquare
  migrate:
    volumes:
      - type: bind
        source: ${TOWNSQUARE_LEDGER_DATA_DIR:?must be NAS-local, not SMB/NFS}
        target: /var/lib/townsquare
  backup:
    volumes:
      - type: bind
        source: ${TOWNSQUARE_LEDGER_DATA_DIR:?must be NAS-local, not SMB/NFS}
        target: /var/lib/townsquare
        read_only: true
      - type: bind
        source: ${TOWNSQUARE_REGISTRY_DATA_DIR:?must be separate NAS-local registry data}
        target: /var/lib/registry
        read_only: true
      - type: bind
        source: ${TOWNSQUARE_BACKUP_DIR:?must be a distinct encrypted-backup target}
        target: /var/backups/townsquare
