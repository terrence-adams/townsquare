# Town Registrar viewer — app configuration.
#
# Server settings that matter for the container are ALSO set as STREAMLIT_*
# environment variables in compose.yml, because this file is baked into the
# image and the deployment should not need a rebuild to change a port.

[server]
headless = true
port = 8502
# enableCORS and enableXsrfProtection are left at their secure defaults on
# purpose. Direct LAN access by hostname does not need them relaxed — that is
# a reverse-proxy workaround, and there is no proxy in front of this. If a
# proxy is ever added and the websocket fails to connect, those two are the
# knobs, and turning them off should be a decision with a reason attached.

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#2f6f4e"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f2f4f3"
textColor = "#1c2321"
