name: townsquare-canary-20261007-a

x-identity: &identity
  TOWNSQUARE_RUNTIME_CLASS: "${TOWNSQUARE_RUNTIME_CLASS:?required}"
  TOWNSQUARE_AUTHORITY_CLASS: "${TOWNSQUARE_AUTHORITY_CLASS:?required}"
  TOWNSQUARE_CANARY_LABEL: "${TOWNSQUARE_CANARY_LABEL:?required}"
  TOWNSQUARE_COMPOSE_PROJECT: "${TOWNSQUARE_COMPOSE_PROJECT:?required}"
  TOWNSQUARE_SOURCE_COMMIT: "${TOWNSQUARE_SOURCE_COMMIT:?required}"
  TOWNSQUARE_SOURCE_TREE: "${TOWNSQUARE_SOURCE_TREE:?required}"
  TOWNSQUARE_R7_RELEASE_ID: "${TOWNSQUARE_R7_RELEASE_ID:?required}"
  TOWNSQUARE_R7_INPUT_MANIFEST_SHA256: "${TOWNSQUARE_R7_INPUT_MANIFEST_SHA256:?required}"
  TOWNSQUARE_CONTEXT_MANIFEST: /run/config/canary-context-manifest.json

x-hardened: &hardened
  restart: "no"
  read_only: true
  pull_policy: never
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  mem_limit: 512m
  cpus: 1.0
  networks: [canary-internal]
  logging:
    driver: local
    options: {max-size: 10m, max-file: "5"}

services:
  ledger-migrate:
    <<: *hardened
    image: "townsquare-canary-ledger:${TOWNSQUARE_SOURCE_COMMIT:?required}"
    user: "10001:10001"
    command: ["python", "-m", "canary.preexec", "--", "python", "-c", "from registrar.app.db import connect,migrate; import os; d=connect(os.environ['REGISTRAR_DB']); migrate(d); d.close()"]
    environment:
      <<: *identity
      REGISTRAR_DB: /var/lib/townsquare/ledger.db
    volumes:
      - {type: bind, source: /volume1/Docker/townsquare-canary-20261007-a/data/ledger, target: /var/lib/townsquare}
      - {type: bind, source: /volume1/Docker/townsquare-canary-20261007-a/config/canary-context-manifest.json, target: /run/config/canary-context-manifest.json, read_only: true}
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m,mode=1777"]

  ledger:
    <<: *hardened
    image: "townsquare-canary-ledger:${TOWNSQUARE_SOURCE_COMMIT:?required}"
    user: "10001:10001"
    depends_on:
      ledger-migrate: {condition: service_completed_successfully}
      registry-migrate: {condition: service_completed_successfully}
    environment:
      <<: *identity
      REGISTRAR_ENV: canary
      REGISTRAR_DB: /var/lib/townsquare/ledger.db
      REGISTRAR_CURSOR_KEY_FILE: /run/secrets/ledger-cursor-signing-key
      TOWNSQUARE_RECEIPT_HASH_KEY_FILE: /run/secrets/ledger-receipt-hash-key
      TOWNSQUARE_CANARY_TEST_PUBLIC_KEY_FILE: /run/config/canary-test-authority.pub
      TOWNSQUARE_CONTEXT_MANIFEST: /run/config/canary-context-manifest.json
      TOWNSQUARE_LEDGER_CONTEXT_MANIFEST: /run/config/ledger-context-manifest.json
      TOWNSQUARE_LEDGER_CONTEXT_MANIFEST_SHA256: "${TOWNSQUARE_LEDGER_CONTEXT_MANIFEST_SHA256:?required}"
      REGISTRY_READINESS_TOKEN_FILE: /run/secrets/ledger-to-registry-readiness
      REGISTRY_PEER_READINESS_TOKEN_FILE: /run/secrets/registry-to-ledger-readiness
      TOWNSQUARE_SERVICE_ID: townsquare-ledger-v0
      TOWNSQUARE_LEDGER_SCHEMA_HEAD: "14"
      TOWNSQUARE_REGISTRY_AUDIT_CONTRACT: registry-ledger-audit-v1
      REGISTRY_INTEGRATION_ENABLED: "true"
      REGISTRY_SERVICE_ID: townsquare-registry-v0
      REGISTRY_SCHEMA_HEAD: "2"
      REGISTRY_AUDIT_CONTRACT_VERSION: registry-ledger-audit-v1
      REGISTRY_READINESS_URL: http://registry:8789/health/ready
    volumes:
      - {type: bind, source: /volume1/Docker/townsquare-canary-20261007-a/data/ledger, target: /var/lib/townsquare}
      - {type: bind, source: /volume1/Docker/townsquare-canary-20261007-a/secrets/ledger-token-pepper, target: /run/secrets/ledger-token-pepper, read_only: true}
      - {type: bind, source: /volume1/Docker/townsquare-canary-20261007-a/secrets/ledger-cursor-signing-key, target: /run/secrets/ledger-cursor-signing-key, read_only: true}
      - {type: bind, source: /volume1/Docker/townsquare-canary-20261007-a/secrets/ledger-receipt-hash-key, target: /run/secrets/ledger-receipt-hash-key, read_only: true}
      - {type: bind, source: /volume1/Docker/townsquare-canary-20261007-a/secrets/ledger-to-registry-readiness.ledger, target: /run/secrets/ledger-to-registry-readiness, read_only: true}
      - {type: bind, source: /volume1/Docker/townsquare-canary-20261007-a/secrets/registry-to-ledger-readiness.ledger, target: /run/secrets/registry-to-ledger-readiness, read_only: true}
      - {type: bind, source: /volume1/Docker/townsquare-canary-20261007-a/config/canary-context-manifest.json, target: /run/config/canary-context-manifest.json, read_only: true}
      - {type: bind, source: /volume1/Docker/townsquare-canary-20261007-a/config/ledger-context-manifest.json, target: /run/config/ledger-context-manifest.json, read_only: true}
      - {type: bind, source: /volume1/Docker/townsquare-canary-20261007-a/config/canary-test-authority.pub, target: /run/config/canary-test-authority.pub, read_only: true}
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m,mode=1777"]
    ports: ["192.168.2.3:18790:8790"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8790/health/internal/ready',timeout=2).read()"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s

  registry-migrate:
    <<: *hardened
    image: "townsquare-canary-registry:${TOWNSQUARE_SOURCE_COMMIT:?required}"
    user: "10003:10003"
    command: ["python", "-m", "canary.preexec", "--", "python", "/app/migrate.py"]
    environment:
      <<: *identity
      REGISTRY_DB: /var/lib/registry/registry.db
    volumes:
      - {type: bind, source: /volume1/Docker/townsquare-canary-20261007-a/data/registry, target: /var/lib/registry}
      - {type: bind, source: /volume1/Docker/townsquare-canary-20261007-a/config/canary-context-manifest.json, target: /run/config/canary-context-manifest.json, read_only: true}
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m,mode=1777"]

  registry:
    <<: *hardened
    image: "townsquare-canary-registry:${TOWNSQUARE_SOURCE_COMMIT:?required}"
    user: "10003:10003"
    depends_on:
      registry-migrate: {condition: service_completed_successfully}
      ledger-migrate: {condition: service_completed_successfully}
    environment:
      <<: *identity
      REGISTRY_DB: /var/lib/registry/registry.db
      REGISTRY_TOKEN_FILE: /run/secrets/registry-api-credential
      REGISTRY_LEDGER_AUDIT_TOKEN_FILE: /run/secrets/registry-audit-credential
      LEDGER_READINESS_TOKEN_FILE: /run/secrets/registry-to-ledger-readiness
      REGISTRY_PEER_READINESS_TOKEN_FILE: /run/secrets/ledger-to-registry-readiness
      REGISTRY_CANARY_NONCE_DIRECTORY: /var/lib/registry/canary-nonces
      REGISTRY_AUDIT_DELIVERY_MODE: manual
      REGISTRY_AUDIT_CONTRACT_VERSION: registry-ledger-audit-v1
      REGISTRY_SERVICE_ID: townsquare-registry-v0
      REGISTRY_SCHEMA_HEAD: "2"
      REGISTRY_LEDGER_SERVICE_ID: townsquare-ledger-v0
      REGISTRY_LEDGER_SCHEMA_HEAD: "14"
      REGISTRY_LEDGER_AUDIT_CONTRACT: registry-ledger-audit-v1
      TOWNSQUARE_CONTEXT_MANIFEST: /run/config/canary-context-manifest.json
    volumes:
      - {type: bind, source: /volume1/Docker/townsquare-canary-20261007-a/data/registry, target: /var/lib/registry}
      - {type: bind, source: /volume1/Docker/townsquare-canary-20261007-a/secrets/registry-api-credential, target: /run/secrets/registry-api-credential, read_only: true}
      - {type: bind, source: /volume1/Docker/townsquare-canary-20261007-a/secrets/registry-audit-credential, target: /run/secrets/registry-audit-credential, read_only: true}
      - {type: bind, source: /volume1/Docker/townsquare-canary-20261007-a/secrets/ledger-to-registry-readiness.registry, target: /run/secrets/ledger-to-registry-readiness, read_only: true}
      - {type: bind, source: /volume1/Docker/townsquare-canary-20261007-a/secrets/registry-to-ledger-readiness.registry, target: /run/secrets/registry-to-ledger-readiness, read_only: true}
      - {type: bind, source: /volume1/Docker/townsquare-canary-20261007-a/config/canary-test-authority.pub, target: /run/config/canary-test-authority.pub, read_only: true}
      - {type: bind, source: /volume1/Docker/townsquare-canary-20261007-a/config/canary-context-manifest.json, target: /run/config/canary-context-manifest.json, read_only: true}
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m,mode=1777"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8789/health/internal/ready',timeout=2).read()"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s

  viewer:
    <<: *hardened
    image: "townsquare-canary-viewer:${TOWNSQUARE_SOURCE_COMMIT:?required}"
    user: "10002:10002"
    depends_on:
      ledger: {condition: service_healthy}
    environment:
      <<: *identity
      TOWNSQUARE_VIEWER_PROFILE: native-ledger-mvp
      REGISTRAR_BASE_URL: http://ledger:8790
      HOME: /tmp
    volumes:
      - {type: bind, source: /volume1/Docker/townsquare-canary-20261007-a/secrets/viewer-native-credential, target: /run/secrets/viewer-native-credential, read_only: true}
      - {type: bind, source: /volume1/Docker/townsquare-canary-20261007-a/config/canary-context-manifest.json, target: /run/config/canary-context-manifest.json, read_only: true}
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,mode=1777"]
    ports: ["192.168.2.3:18502:8502"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8502/_stcore/health',timeout=2).read()"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 45s

networks:
  canary-internal:
    name: townsquare-canary-20261007-a-internal
    internal: true
